# Service v7 · agendador (4.18 e 5.3): de hora em hora chama a rota que manda
# o lembrete do aviso para quem não viu e esvazia a fila de avisos (silêncio
# das 22h às 7h e resumo do Mural). Feito no GitHub porque o plano gratuito da
# Vercel só roda cron uma vez por dia.
#
# Sem segredo nenhum: o job pede ao GitHub um token OIDC (assinado pelo
# GitHub, válido por minutos) e a rota confere que veio deste repositório,
# do main e deste arquivo (app/lib/github-oidc.ts). Agendamento só roda no
# branch padrão (main).
name: Service · agendador

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.SERVICE_URL || 'https://campusexpansao.vercel.app' }}
    steps:
      - name: Chamar a rota do agendador
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=campusexpansao-service-cron" | jq -r .value)
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" "$URL/api/service/cron/lembretes"
