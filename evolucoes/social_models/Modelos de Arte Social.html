<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CE.X · Modelos de Arte — Carrossel & Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400;1,14..32,500;1,14..32,700;1,14..32,800;1,14..32,900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0E110D; --graphite:#161A12; --border:#25291F; --border-2:#2E3327;
  --olive:#7A9E3F; --olive-soft:#94B85C; --olive-deep:#4F6B26;
  --cream:#EDE6D3; --cream-soft:#F6F1E0; --sand:#C9BFA0;
  --white:#FAFAF7; --light:#E6E5DD; --muted:#8B8C82; --subtle:#555650;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";font-variation-settings:"opsz" 144;}

/* ════════ CHROME COMUM (logo, filete, marca d'água) ════════ */
.csx-logo,.stx .csx-logo{font-family:var(--sans);font-weight:800;letter-spacing:-.045em;color:var(--cream-soft);line-height:1;}
.csx-logo .dot{color:var(--olive);}
.csx-logo .x{color:var(--olive);font-style:italic;font-weight:800;}

/* ════════ CARROSSEL · 4:5 (1080×1350) ════════ */
.csx{width:1080px;height:1350px;background:var(--ink);position:relative;overflow:hidden;}
.csx.graphite{background:var(--graphite);}
.csx.cream{background:var(--cream-soft);}
.csx-rule{position:absolute;top:0;left:0;right:0;height:5px;background:var(--olive);z-index:3;}
.csx-wm{position:absolute;right:-46px;bottom:-150px;font-family:var(--sans);font-weight:800;font-style:italic;font-size:780px;line-height:.7;color:rgba(122,158,63,.07);z-index:0;pointer-events:none;white-space:nowrap;}
.csx-wm.word{right:-30px;bottom:-30px;font-size:300px;letter-spacing:-.05em;}
.csx-wm.word .x{color:rgba(122,158,63,.09);}
.csx.cream .csx-wm{color:rgba(79,107,38,.10);}
.csx.cream .csx-wm.word .x{color:rgba(79,107,38,.12);}
.csx-inner{position:absolute;inset:0;z-index:2;padding:64px 90px 84px;display:flex;flex-direction:column;}
.csx-top{display:flex;justify-content:space-between;align-items:center;}
.csx.cream .csx-logo{color:var(--ink);}
.csx.cream .csx-logo .dot,.csx.cream .csx-logo .x{color:var(--olive-deep);}
.csx-counter{font-family:var(--mono);font-size:21px;letter-spacing:.18em;color:var(--olive-deep);white-space:nowrap;}
.csx.cream .csx-counter{color:var(--olive-deep);}
.csx-body{flex:1;display:flex;flex-direction:column;justify-content:center;}

.csx-eyebrow{font-family:var(--mono);font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);margin-bottom:36px;}
.csx.cream .csx-eyebrow{color:var(--olive-deep);}
.csx-h{font-family:var(--sans);font-weight:800;font-size:124px;line-height:.96;letter-spacing:-.04em;color:var(--cream-soft);text-wrap:balance;}
.csx-h em{font-style:italic;font-weight:800;color:var(--olive);}
.csx.cream .csx-h{color:var(--ink);} .csx.cream .csx-h em{color:var(--olive-deep);}
.csx-h.olive-it{font-style:italic;color:var(--olive);}
.csx.cream .csx-h.olive-it{color:var(--olive-deep);}
.csx-dash{width:96px;height:5px;background:var(--olive);margin:38px 0;border-radius:2px;}
.csx.cream .csx-dash{background:var(--olive-deep);}

/* lista (dashes + filetes) */
.csx-list{list-style:none;margin-top:44px;}
.csx-list li{display:flex;align-items:center;gap:30px;font-family:var(--sans);font-weight:700;font-size:64px;letter-spacing:-.025em;color:var(--cream-soft);padding:28px 0;border-top:1.5px solid var(--border-2);}
.csx-list li:last-child{border-bottom:1.5px solid var(--border-2);}
.csx-list li::before{content:'—';color:var(--olive);font-weight:500;}
.csx.cream .csx-list li{color:var(--ink);border-color:rgba(14,17,13,.14);}

/* passo numerado (número gigante oliva) */
.csx-num{font-family:var(--sans);font-weight:800;font-size:300px;line-height:.74;letter-spacing:-.05em;color:var(--olive);}
.csx.cream .csx-num{color:var(--olive-deep);}
.csx-step{font-family:var(--sans);font-weight:800;font-size:120px;line-height:.9;letter-spacing:-.035em;color:var(--cream-soft);margin-top:8px;}
.csx.cream .csx-step{color:var(--ink);}
.csx-sub{font-family:var(--sans);font-style:italic;font-weight:400;font-size:52px;line-height:1.25;color:var(--muted);margin-top:30px;max-width:780px;}
.csx-foot{font-family:var(--mono);font-size:22px;letter-spacing:.06em;color:var(--olive);margin-top:40px;}

/* ════════ STORIES · 9:16 (1080×1920) · frame único ════════ */
.stx{width:1080px;height:1920px;background:var(--ink);position:relative;overflow:hidden;}
.stx.graphite{background:var(--graphite);}
.stx-rule{position:absolute;top:0;left:0;right:0;height:5px;background:var(--olive);z-index:3;}
.stx-wm{position:absolute;right:-46px;bottom:120px;font-family:var(--sans);font-weight:800;font-style:italic;font-size:740px;line-height:.7;color:rgba(122,158,63,.06);z-index:0;pointer-events:none;}
.stx-inner{position:absolute;inset:0;z-index:2;padding:100px 88px 360px;display:flex;flex-direction:column;}
.stx-top{display:flex;justify-content:space-between;align-items:center;}
.stx-mid{flex:1;display:flex;flex-direction:column;justify-content:center;}
.stx-kicker{font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin-bottom:42px;}
.stx-h{font-family:var(--sans);font-weight:800;font-size:138px;line-height:.95;letter-spacing:-.04em;color:var(--cream-soft);text-wrap:balance;}
.stx-h em{font-style:italic;font-weight:800;color:var(--olive);}
.stx-bridge{font-family:var(--sans);font-style:italic;font-weight:400;font-size:46px;line-height:1.3;color:var(--muted);margin-top:46px;max-width:860px;}
.stx-cta-wrap{display:flex;}
.stx-pill{display:inline-flex;align-items:center;background:var(--olive);color:var(--ink);font-family:var(--sans);font-weight:800;font-size:48px;letter-spacing:-.015em;padding:32px 50px;border-radius:16px;}
.stx-safe{position:absolute;left:0;right:0;bottom:0;height:310px;z-index:1;border-top:1.5px dashed rgba(122,158,63,.30);background:repeating-linear-gradient(45deg,rgba(122,158,63,.025) 0 14px,transparent 14px 28px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px;pointer-events:none;}
.stx-safe span{font-family:var(--mono);font-size:18px;letter-spacing:.14em;color:rgba(139,140,130,.7);}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel" src="arts.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { CSlide, SStory } = window;

/* Frames de prévia: arte em tamanho real (1080), exibida reduzida.
   Como é tudo vetor/texto, fica nítida no modo foco (clique pra ampliar). */
const KC = 384 / 1080;
function FrameC({ children }) {
  return <div style={{ width: 384, height: 480, overflow: 'hidden' }}><div style={{ width: 1080, height: 1350, transform: `scale(${KC})`, transformOrigin: 'top left' }}>{children}</div></div>;
}
function FrameS({ children }) {
  return <div style={{ width: 384, height: 683, overflow: 'hidden' }}><div style={{ width: 1080, height: 1920, transform: `scale(${KC})`, transformOrigin: 'top left' }}>{children}</div></div>;
}

/* Carrossel real "Voluntariado" — demonstra cada TIPO de slide do modelo. */
function CarrosselModel() {
  return (
    <DCSection id="carrossel" title="Carrossel · 4:5 (1080×1350)" subtitle="Tipografia gigante Inter 800 · palavra-chave em itálico oliva · cada slide é um tipo do modelo">
      <DCArtboard id="c1" label="Capa · gancho" width={384} height={480}>
        <FrameC>
          <CSlide variant="ink" counter="01 / 06">
            <div className="csx-eyebrow">Voluntariado · Igreja local</div>
            <h2 className="csx-h">O problema não é falta de <em>voluntário.</em></h2>
          </CSlide>
        </FrameC>
      </DCArtboard>

      <DCArtboard id="c2" label="Tese · contraponto" width={384} height={480}>
        <FrameC>
          <CSlide variant="graphite" counter="02 / 06">
            <h2 className="csx-h">Muitas vezes, é falta de <em>direção.</em></h2>
          </CSlide>
        </FrameC>
      </DCArtboard>

      <DCArtboard id="c3" label="Sintomas · lista" width={384} height={480}>
        <FrameC>
          <CSlide variant="ink" counter="03 / 06">
            <h2 className="csx-h" style={{ fontSize: 92 }}>A pessoa quer servir, mas não sabe:</h2>
            <ul className="csx-list">
              <li>por onde começar</li>
              <li>com quem falar</li>
              <li>o que fazer</li>
            </ul>
          </CSlide>
        </FrameC>
      </DCArtboard>

      <DCArtboard id="c4" label="Passo · número (ink)" width={384} height={480}>
        <FrameC>
          <CSlide variant="ink" counter="04 / 06">
            <div className="csx-num">1.</div>
            <h2 className="csx-step">Entrada</h2>
            <p className="csx-sub">Como alguém demonstra interesse em servir?</p>
          </CSlide>
        </FrameC>
      </DCArtboard>

      <DCArtboard id="c5" label="Passo · número (cream)" width={384} height={480}>
        <FrameC>
          <CSlide variant="cream" counter="05 / 06" wm="word">
            <div className="csx-num">2.</div>
            <h2 className="csx-step">Preparo</h2>
            <p className="csx-sub">Como essa pessoa é orientada antes de entrar na escala?</p>
          </CSlide>
        </FrameC>
      </DCArtboard>

      <DCArtboard id="c6" label="Fecho · punch" width={384} height={480}>
        <FrameC>
          <CSlide variant="ink" counter="06 / 06">
            <h2 className="csx-h" style={{ fontSize: 104 }}>Voluntariado saudável não começa na escala.</h2>
            <div className="csx-dash"></div>
            <h2 className="csx-h olive-it" style={{ fontSize: 104 }}>Começa na jornada.</h2>
            <div className="csx-foot">@campus.expansao · campusexpansao.com.br</div>
          </CSlide>
        </FrameC>
      </DCArtboard>
    </DCSection>
  );
}

/* Stories: frame ÚNICO que converte. Duas variações de gancho. */
function StoriesModel() {
  return (
    <DCSection id="stories" title="Stories · 9:16 (1080×1920) · frame único que converte" subtitle="Um só frame: gancho gigante → ponte → CTA. A base fica livre pra UI do Instagram e o botão do tráfego pago">
      <DCArtboard id="s1" label="Variação A · gancho-dor" width={384} height={683}>
        <FrameS>
          <SStory variant="ink" kicker="Líder de igreja"
            bridge="Tem um material pronto que organiza isso em 4 passos."
            cta="ARRASTA PRA CIMA ↑">
            <h2 className="stx-h">Sua equipe não está cansada. Está <em>sem direção.</em></h2>
          </SStory>
        </FrameS>
      </DCArtboard>

      <DCArtboard id="s2" label="Variação B · gancho-promessa" width={384} height={683}>
        <FrameS>
          <SStory variant="graphite" kicker="Voluntariado"
            bridge="Baixe o guia e aplique já no próximo culto."
            cta="VER O MATERIAL →">
            <h2 className="stx-h">Voluntário bom não <em>falta.</em> Foi mal <em>preparado.</em></h2>
          </SStory>
        </FrameS>
      </DCArtboard>
    </DCSection>
  );
}

function App() {
  return (
    <DesignCanvas initialTf={{ x: 80, y: 80, scale: 0.9 }}>
      <CarrosselModel />
      <StoriesModel />
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
