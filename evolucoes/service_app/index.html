  <script>
    /* PWA: captura o prompt de instalação (guardado).
       O registro do service worker fica DESLIGADO no protótipo para o app
       sempre refletir as últimas mudanças. Claude Code liga em produção:
       navigator.serviceWorker.register('sw.js')  */
    (function () {
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__cexDeferredPrompt = e;
        window.dispatchEvent(new Event('cex-installable'));
      });
    })();
  </script>
