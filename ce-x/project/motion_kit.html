<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CE.X Motion Kit — Biblioteca de animações para Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink:        #0E110D;
    --graphite:   #181B16;
    --card:       #1F221C;
    --border:     #25291F;
    --border-2:   #2E3327;
    --olive:      #7A9E3F;
    --olive-soft: #94B85C;
    --olive-deep: #4F6B26;
    --olive-dim:  rgba(122,158,63,0.08);
    --olive-line: rgba(122,158,63,0.22);
    --cream:      #EDE6D3;
    --cream-soft: #F6F1E0;
    --white:      #FAFAF7;
    --light:      #E6E5DD;
    --muted:      #8B8C82;
    --subtle:     #555650;
    --sans:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:       'SF Mono', 'Fira Code', ui-monospace, monospace;
  }
  html, body { background: var(--ink); color: var(--white); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  /* Mount point */
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Animation engine -->
<script type="text/babel" src="animations.jsx"></script>

<!-- Motion kit components -->
<script type="text/babel" src="motion_components.jsx"></script>

<!-- App shell -->
<script type="text/babel" src="motion_kit_app.jsx"></script>
</body>
</html>
