document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

* FONTES */\n  --serif: 'Fraunces', 'Times New Roman', serif;\n  --sans:  'Geist', -apple-system, BlinkMacSystemFont, sans-serif;\n  --mono:  'Geist Mono', 'SF Mono', monospace;\n}\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  background: var(--ink);\n  font-family: var(--sans);\n  color: var(--white);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\na { color: inherit; text-decoration: none; }\n\n/* ──────────── ESTRUTURA ──────────── */\n.page { max-width: 1240px; margin: 0 auto; }\n\n.section {\n  padding: 120px 72px 0;\n  max-width: 1240px;\n  margin: 0 auto;\n  position: relative;\n}\n\n.section-head {\n  display: grid;\n  grid-template-columns: 1fr 2fr;\n  gap: 64px;\n  align-items: end;\n  padding-bottom: 56px;\n  border-bottom: 0.5px solid var(--border-2);\n  margin-bottom: 56px;\n}\n.section-head-left { display: flex; flex-direction: column; gap: 18px; }\n.section-num {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.08em;\n  color: var(--olive);\n  font-weight: 500;\n}\n.section-num::before {\n  content: '§ ';\n  color: var(--subtle);\n}\n.section-title {\n  font-family: var(--serif);\n  font-size: 72px;\n  font-weight: 400;\n  letter-spacing: -0.04em;\n  line-height: 0.95;\n  color: var(--white);\n  font-variation-settings: \"opsz\" 144;\n}\n.section-title em {\n  font-style: italic;\n  color: var(--olive);\n  font-weight: 400;\n}\n.section-desc {\n  font-size: 16px;\n  font-weight: 400;\n  color: var(--muted);\n  line-height: 1.7;\n  max-width: 520px;\n}\n.section-desc strong { color: var(--light); font-weight: 500; }\n\n.divider {\n  height: 0.5px;\n  background: var(--border);\n  margin: 0 72px;\n}\n\n.eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--olive);\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n}\n.eyebrow::before {\n  content: '';\n  width: 18px;\n  height: 1px;\n  background: var(--olive);\n}\n\n.caption {\n  font-size: 11px;\n  font-weight: 400;\n  letter-spacing: 0.04em;\n  color: var(--subtle);\n  line-height: 1.6;\n  font-family: var(--mono);\n}\n\n.format-tag {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  background: var(--olive-dim);\n  border: 0.5px solid var(--olive-line);\n  border-radius: 100px;\n  padding: 7px 14px;\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.08em;\n  color: var(--olive);\n  font-weight: 500;\n  text-transform: uppercase;\n}\n.format-tag::before {\n  content: '';\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: var(--olive);\n}\n\n/* ══════════════════════════════════════\n   HERO\n══════════════════════════════════════ */\n.hero {\n  position: relative;\n  padding: 140px 72px 120px;\n  min-height: 90vh;\n  background: var(--ink);\n  border-bottom: 0.5px solid var(--border-2);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n}\n\n/* Grid agrícola sutil */\n.hero-grid {\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(to right, rgba(122,158,63,0.04) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(122,158,63,0.025) 1px, transparent 1px);\n  background-size: 80px 80px, 80px 80px;\n  mask-image: radial-gradient(ellipse at 60% 40%, black 0%, transparent 70%);\n  pointer-events: none;\n}\n\n/* X monumental marca d'água */\n.hero-x-mark {\n  position: absolute;\n  right: -80px; bottom: -120px;\n  font-family: var(--serif);\n  font-size: 720px;\n  font-weight: 300;\n  font-style: italic;\n  color: var(--olive);\n  opacity: 0.07;\n  line-height: 0.8;\n  letter-spacing: -0.1em;\n  pointer-events: none;\n  font-variation-settings: \"opsz\" 144;\n}\n\n.hero-content { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; width: 100%; }\n.hero-eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--olive);\n  margin-bottom: 60px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n.dot-cluster {\n  display: inline-flex;\n  gap: 4px;\n}\n.dot-cluster span {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: var(--olive);\n}\n.dot-cluster span:nth-child(2) { opacity: 0.55; }\n.dot-cluster span:nth-child(3) { opacity: 0.25; }\n\n.hero-logo {\n  font-family: var(--serif);\n  font-size: 220px;\n  font-weight: 500;\n  letter-spacing: -0.05em;\n  line-height: 0.88;\n  margin-bottom: 56px;\n  display: flex;\n  align-items: baseline;\n  color: var(--white);\n  font-variation-settings: \"opsz\" 144;\n}\n.hero-logo .dot { color: var(--olive); }\n.hero-logo .x {\n  color: var(--olive);\n  font-weight: 300;\n  font-style: italic;\n  letter-spacing: -0.04em;\n}\n\n.hero-tagline-wrap {\n  display: flex;\n  align-items: stretch;\n  gap: 28px;\n  max-width: 620px;\n}\n.hero-divider {\n  width: 1px;\n  background: linear-gradient(to bottom, var(--olive) 0%, transparent 100%);\n  flex-shrink: 0;\n}\n.hero-tagline {\n  font-family: var(--serif);\n  font-size: 22px;\n  font-weight: 400;\n  color: var(--light);\n  line-height: 1.55;\n  letter-spacing: -0.01em;\n}\n.hero-tagline em {\n  color: var(--olive);\n  font-style: italic;\n}\n\n.hero-meta {\n  position: relative;\n  z-index: 2;\n  margin-top: 100px;\n  max-width: 1100px;\n  margin-left: auto;\n  margin-right: auto;\n  width: 100%;\n  display: grid;\n  grid-template-columns: repeat(3, max-content);\n  gap: 48px;\n  padding-top: 32px;\n  border-top: 0.5px solid var(--border-2);\n}\n.hero-meta-row {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n.hero-meta-k {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--subtle);\n}\n.hero-meta-v {\n  font-family: var(--mono);\n  font-size: 12px;\n  color: var(--light);\n}\n\n/* ══════════════════════════════════════\n   SUMÁRIO\n══════════════════════════════════════ */\n.toc {\n  padding: 80px 72px;\n  border-bottom: 0.5px solid var(--border-2);\n  max-width: 1240px;\n  margin: 0 auto;\n}\n.toc-head {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  margin-bottom: 48px;\n}\n.toc-count {\n  font-family: var(--mono);\n  font-size: 11px;\n  color: var(--subtle);\n  letter-spacing: 0.06em;\n}\n.toc-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 0;\n  border-top: 0.5px solid var(--border);\n}\n.toc-item {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: center;\n  gap: 18px;\n  padding: 22px 24px;\n  border-bottom: 0.5px solid var(--border);\n  border-right: 0.5px solid var(--border);\n  transition: background 0.2s;\n}\n.toc-item:hover { background: var(--graphite); }\n.toc-item:nth-child(3n) { border-right: none; }\n.toc-num {\n  font-family: var(--mono);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 0.06em;\n  color: var(--olive);\n  min-width: 22px;\n}\n.toc-name {\n  font-family: var(--sans);\n  font-size: 14px;\n  font-weight: 400;\n  color: var(--light);\n  letter-spacing: -0.005em;\n}\n.toc-pages {\n  font-family: var(--mono);\n  font-size: 10px;\n  color: var(--subtle);\n  letter-spacing: 0.04em;\n}\n\n/* ══════════════════════════════════════\n   01 — LOGO\n══════════════════════════════════════ */\n.logo-versions {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 16px;\n  margin-bottom: 56px;\n}\n.logo-card {\n  background: var(--graphite);\n  border: 0.5px solid var(--border-2);\n  border-radius: 4px;\n  padding: 80px 40px 32px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  min-height: 320px;\n  position: relative;\n  overflow: hidden;\n}\n.logo-card.lc-cream { background: var(--cream); border-color: rgba(0,0,0,0.10); }\n.logo-card.lc-olive { background: var(--olive); border-color: rgba(0,0,0,0.10); }\n\n.logo-display {\n  font-family: var(--serif);\n  font-size: 100px;\n  font-weight: 500;\n  letter-spacing: -0.05em;\n  line-height: 0.9;\n  color: var(--white);\n  font-variation-settings: \"opsz\" 144;\n}\n.logo-display .dot { color: var(--olive); }\n.logo-display .x {\n  color: var(--olive);\n  font-weight: 300;\n  font-style: italic;\n}\n.lc-cream .logo-display { color: var(--ink); }\n.lc-cream .logo-display .dot { color: var(--olive-deep); }\n.lc-cream .logo-display .x { color: var(--olive-deep); }\n.lc-olive .logo-display { color: var(--ink); }\n.lc-olive .logo-display .dot { color: rgba(14,17,13,0.50); }\n.lc-olive .logo-display .x { color: var(--ink); }\n\n.logo-card-foot {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  margin-top: 56px;\n}\n.logo-card-label {\n  font-family: var(--mono);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--subtle);\n}\n.lc-cream .logo-card-label { color: rgba(14,17,13,0.50); }\n.lc-olive .logo-card-label { color: rgba(14,17,13,0.55); }\n.logo-card-tag {\n  font-family: var(--mono);\n  font-size: 9px;\n  letter-spacing: 0.08em;\n  color: var(--subtle);\n}\n.lc-cream .logo-card-tag { color: rgba(14,17,13,0.40); }\n.lc-olive .logo-card-tag { color: rgba(14,17,13,0.45); }\n\n/* Variações de logo */\n.logo-variations {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 14px;\n  margin-bottom: 56px;\n}\n.lv-card {\n  background: var(--graphite);\n  border: 0.5px solid var(--border-2);\n  border-radius: 4px;\n  padding: 40px 32px 24px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  min-height: 220px;\n}\n.lv-display { flex: 1; display: flex; align-items: center; }\n.lv-label {\n  font-family: var(--mono);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--subtle);\n  margin-top: 24px;\n}\n\n.lv1-symbol { eft\">\n      <div class=\"section-num\">01 · Identidade<\u002Fdiv>\n      <h2 class=\"section-title\">Sistema de <em>Logo<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"section-desc\">\n      O logotipo CE.X é o símbolo central da marca. <strong>CE<\u002Fstrong> em peso regular reto representa o que cabe a nós — estrutura, ensino, preparo. O <strong>X<\u002Fstrong> em itálico leve representa a variável divina — o crescimento que escapa ao nosso controle. O <strong>ponto<\u002Fstrong> entre eles é o sinal de multiplicação: o encontro do humano com o divino.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"logo-versions\">\n    <div class=\"logo-card\">\n      <div class=\"logo-display\">CE<span class=\"dot\">.<\u002Fspan><span class=\"x\">X<\u002Fspan><\u002Fdiv>\n      <div class=\"logo-card-foot\">\n        <span class=\"logo-card-label\">Principal<\u002Fspan>\n        <span class=\"logo-card-tag\">Fundo escuro · 01<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"logo-card lc-cream\">\n      <div class=\"logo-display\">CE<span class=\"dot\">.<\u002Fspan><span class=\"x\">X<\u002Fspan><\u002Fdiv>\n      <div class=\"logo-card-foot\">\n        <span class=\"logo-card-label\">Invertido<\u002Fspan>\n        <span class=\"logo-card-tag\">Papel · 02<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"logo-card lc-olive\">\n      <div class=\"logo-display\">CE<span class=\"dot\">.<\u002Fspan><span class=\"x\">X<\u002Fspan><\u002Fdiv>\n      <div class=\"logo-card-foot\">\n        <span class=\"logo-card-label\">Verde<\u002Fspan>\n        <span class=\"logo-card-tag\">Capas · 03<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-bottom: 16px;\">\n    <span class=\"eyebrow\">Variações de uso<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"logo-variations\">\n    <div class=\"lv-card\">\n      <div class=\"lv-display\">\n        <div class=\"lv1-symbol\">.<span class=\"x\">X<\u002Fspan><\u002Fdiv>\n      < sito.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meaning-card\">\n      <div class=\"meaning-letter italic\">X<\u002Fdiv>\n      <div class=\"meaning-title\">Variável Divina<\u002Fdiv>\n      <div class=\"meaning-desc\">O crescimento que só Deus dá. A parte que escapa ao nosso controle e nos coloca em dependência.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"logo-construction\">\n    <div class=\"construction-canvas\">\n      <div class=\"construction-grid\"><\u002Fdiv>\n      <div class=\"construction-logo\">CE<span class=\"dot\">.<\u002Fspan><span class=\"x\">X<\u002Fspan><\u002Fdiv>\n      <div class=\"construction-mark m-baseline\">baseline<\u002Fdiv>\n      <div class=\"construction-mark m-cap\">cap height<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"construction-specs\">\n      <div class=\"spec-row\">\n        <div class=\"spec-k\">Display family<\u002Fdiv>\n        <div class=\"spec-v\">Fraunces 144 opsz<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row\">\n        <div class=\"spec-k\">CE · peso<\u002Fdiv>\n        <div class=\"spec-v\">500 (regular)<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row\">\n        <div class=\"spec-k\">X · peso e estilo<\u002Fdiv>\n        <div class=\"spec-v\">300 italic<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row\">\n        <div class=\"spec-k\">Tracking<\u002Fdiv>\n        <div class=\"spec-v\">−0.05em<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row\">\n        <div class=\"spec-k\">Cor do ponto + X<\u002Fdiv>\n        <div class=\"spec-v\">#7A9E3F · Oliva<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"divider\"><\u002Fdiv>\n\n<!-- ══════════════════ 02 — CLEAR SPACE ══════════════════ -->\n<section class=\"section\" id=\"s02\">\n  <div class=\"section-head\">\n    <div class=\"section-head-left\">\n      <div class=\"section-num\">02 · Proteção<\u002Fdiv>\n      <h2 class=\"section-title\">Área de <em>Proteção<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"section-desc\">\n      O logo precisa respirar. A unidade de medida é a <strong>altura do X itálico<\u002Fstrong>. Mantenha pelo menos <strong>1X<\u002Fstrong> de margem livre em todos os lados — sem texto, imagens ou elementos gráficos invadindo o espaço.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"clearspace-wrap\">\n    <div class=\"clearspace-canvas\">\n      <div class=\"cs-margin-h top\"><\u002Fdiv>\n      <div class=\"cs-margin-h bottom\"><\u002Fdiv>\n      <div class=\"cs-margin-v left\"><\u002Fdiv>\n      <div class=\"cs-margin-v right\"><\u002Fdiv>\n      <div class=\"cs-x-unit tl\">X<\u002Fdiv>\n      <div class=\"cs-marker top\">1X<\u002Fdiv>\n      <div class=\"cs-marker right\">1X<\u002Fdiv>\n      <div class=\"cs-logo\">CE<span class=\"dot\">.<\u002Fspan><span class=\"x\">X<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"clearspace-rules\">\n      <div class=\"cs-rule\">\n        <div class=\"cs-rule-h\">Margem mínima<\u002Fdiv>\n        <div class=\"cs-rule-d\">1X em todos os lados — sendo X a altura da letra X itálica.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cs-rule\">\n        <div class=\"cs-rule-h\">Em peças amplas<\u002Fdiv>\n        <div class=\"cs-rule-d\">Use 2X de margem para criar respiro editorial e peso visual.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cs-rule\">\n        <div class=\"cs-rule-h\">Sem invasão<\u002Fdiv>\n        <div class=\"cs-rule-d\">Texto corrido, imagens ou outros logos não podem invadir essa área.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cs-rule\">\n        <div class=\"cs-rule-h\">Cantos e bordas<\u002Fdiv>\n        <div class=\"cs-rule-d\">A margem se aplica também a bordas de telas, cards e contêineres.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 56px;\">\n    <span class=\"eyebrow\">Tamanhos mínimos<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"minsize-grid\">\n    <div class=\
